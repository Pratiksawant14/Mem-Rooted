version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memrooted-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: memrooted
      POSTGRES_PASSWORD: memrooted_dev
      POSTGRES_DB: memrooted
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memrooted -d memrooted"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
